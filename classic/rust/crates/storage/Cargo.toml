[package]
name = "storage"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/storage.rs"
crate-type = ["rlib"]

[dependencies]
opencut-account-core = { path = "../../../../crates/account-core" }
serde_json = "1"
bridge = { version = "0.1.0", path = "../bridge" }
serde = { version = "1", features = ["derive"] }
tsify-next = { version = "0.5", optional = true }
wasm-bindgen = { version = "0.2.116", optional = true }

[features]
wasm = ["dep:wasm-bindgen", "dep:tsify-next", "tsify-next/js"]
