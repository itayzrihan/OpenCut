[package]
name = "opencut-editor-api"
description = "Transport-neutral, self-describing Editor API for OpenCut"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opencut-account-core = { path = "../account-core" }
async-trait = { workspace = true }
jsonschema = { workspace = true }
json-patch = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1.49.0", features = ["sync", "rt", "macros", "time"] }
tokio-util = { workspace = true }
scraper = { version = "0.24.0", default-features = false }
percent-encoding = "2.3"
html5gum = { version = "=0.8.4", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
js-sys = "0.3.93"

[dev-dependencies]
tokio = { version = "1.49.0", features = ["sync", "rt", "macros", "time"] }
