[package]
name = "opencut-mcp-server"
description = "OpenCut Model Context Protocol server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opencut-mcp"
path = "src/main.rs"

[[bin]]
name = "opencut-session-policy"
path = "src/session_policy.rs"

[dependencies]
opencut-editor-api = { path = "../../crates/editor-api" }
opencut-editor-agent = { path = "../../crates/editor-agent" }
serde.workspace = true
serde_json.workspace = true
opencut-mcp = { path = "../../crates/mcp" }
rmcp = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
